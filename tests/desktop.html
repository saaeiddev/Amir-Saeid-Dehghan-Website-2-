<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Desktop · Layout QA</title>
<style>body{margin:0;background:#202225;color:#eee;font:13px system-ui}header{padding:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:5px}#stage{margin:12px;position:relative}iframe{border:0;transform-origin:0 0;background:#eee}pre{padding:10px;white-space:pre-wrap;margin:0}label{display:flex;gap:8px;align-items:center}</style>
<header><label>Viewport <select id="viewport"><option>1440×900</option><option>1920×1080</option><option>2560×1440</option><option>1024×1366</option><option>768×1024</option><option>390×844</option><option>320×568</option></select></label><label>Folder <select id="folder"><option value="">Desktop</option><option value="projects">Projects</option><option value="games">Games</option><option value="movies">Movies</option><option value="photos">Photos</option><option value="books">Books</option><option value="music">Music</option></select></label><button id="run">Run behavior and viewport checks</button><output id="state">Loading</output></header>
<div id="stage"><iframe title="Portfolio preview" src="../index.html"></iframe></div><pre id="results"></pre>
<script>
const frame=document.querySelector('iframe'),viewport=document.querySelector('#viewport'),folder=document.querySelector('#folder'),output=document.querySelector('#results'),state=document.querySelector('#state');
const pause=ms=>new Promise(r=>setTimeout(r,ms));
function layout(){const [w,h]=viewport.value.split('×').map(Number);frame.width=w;frame.height=h;const scale=Math.min(1,(innerWidth-24)/w,(innerHeight-150)/h);frame.style.transform=`scale(${scale})`;document.querySelector('#stage').style.height=`${h*scale}px`;state.textContent=`${w} × ${h} · ${Math.round(scale*100)}% preview`;}
async function showFolder(){const doc=frame.contentDocument;doc.querySelectorAll('[data-action=close]').forEach(b=>b.click());await pause(250);if(folder.value)doc.querySelector(`[data-dock="${folder.value}"]`).click();}
viewport.onchange=layout;folder.onchange=showFolder;addEventListener('resize',layout);frame.onload=layout;
document.querySelector('#run').onclick=async()=>{
 const run=document.querySelector('#run');run.disabled=true;output.textContent='';let checks=0,failures=0;
 function check(value,label){checks++;if(!value)failures++;output.textContent+=`${value?'PASS':'FAIL'} ${label}\n`;}
 const doc=frame.contentDocument,win=frame.contentWindow;
 for(const choice of viewport.options){viewport.value=choice.value;layout();await pause(100);folder.value='projects';await showFolder();await pause(280);const bounds=doc.querySelector('.finder-window').getBoundingClientRect();const dock=doc.querySelector('.dock').getBoundingClientRect();check(bounds.left>=0&&bounds.right<=win.innerWidth+1&&bounds.top>=0&&bounds.bottom<=win.innerHeight,`${choice.value}: window contained`);check(dock.left>=0&&dock.right<=win.innerWidth+1,`${choice.value}: Dock contained`);check(doc.documentElement.scrollWidth===win.innerWidth,`${choice.value}: no page overflow`);const button=doc.querySelector('[data-action=close]').getBoundingClientRect();check(button.left>=0&&button.top>=0&&button.right<=win.innerWidth,`${choice.value}: close control accessible`);}
 viewport.value='1440×900';layout();await pause(100);
 for(const id of ['music','photos','projects','books','games','movies']){folder.value=id;await showFolder();await pause(280);const panel=doc.querySelector(`[data-window="${id}"]`);check(!!panel?.querySelector('.gg-sidebar')&&!!panel?.querySelector('.finder-status'),`${id}: complete Finder chrome`);check(panel.querySelectorAll('.finder-item').length===win.PORTFOLIO_DATA[id].length,`${id}: all content items retained`);panel.querySelector('[data-view=list]').click();check(panel.querySelector('.window-content').dataset.view==='list',`${id}: list view`);panel.querySelector('[data-action=minimize]').click();await pause(300);check(panel.style.display==='none',`${id}: minimized`);doc.querySelector(`[data-dock="${id}"]`).click();await pause(280);check(panel.style.display!== 'none'&&panel.querySelector('.window-content').dataset.view==='list',`${id}: restored with view state`);}
 const panel=doc.querySelector('.finder-window');panel.querySelector('[data-action=minimize]').click();doc.querySelector(`[data-dock="${panel.dataset.window}"]`).click();await pause(350);check(panel.style.display!=='none','rapid minimize/restore stays visible');
 doc.querySelector('.gg-spotlight-trigger').click();const search=doc.querySelector('.gg-spot-input');search.value='V8';search.dispatchEvent(new Event('input',{bubbles:true}));check(doc.querySelector('.gg-spot-results').textContent.includes('V8 Engine'),'Spotlight finds a project by content title');doc.querySelector('.gg-spot-result').click();await pause(250);check(doc.querySelector('[data-window=projects] .finder-item.selected')?.textContent.includes('V8 Engine'),'Spotlight reveals and selects matching item');
 const assets=['golden-ribbons.svg','icons/finder.svg','icons/folder.svg','icons/photos.svg','icons/books.svg','icons/music.svg','icons/safari.svg','icons/movies.svg','icons/trash.svg'];for(const path of assets){const response=await fetch('../assets/'+path);check(response.ok,`local asset: ${path}`)}
 folder.value='projects';await showFolder();state.textContent=`${checks} checks · ${failures} failed`;output.textContent+=`\n${checks} checks; ${failures} failures. External media and visual appearance require separate inspection.`;run.disabled=false;
};
</script></html>
